name: troov
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  stomp_dart_client: ^3.0.0
  visibility_detector: ^0.4.0+2
  http: ^1.1.0
  video_player: ^2.8.1
  local_auth: ^2.1.8
  flutter_contacts: ^1.1.9+2
  geolocator: ^14.0.2
  share_plus: ^12.0.1
  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_troov.jpeg"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
